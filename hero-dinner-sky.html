<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner in the Sky — Elevarse es cosa de locos</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      background-image: url('./hero-web-bg.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(2, 12, 28, .28) 0%,
        rgba(2, 12, 28, .12) 42%,
        rgba(2, 12, 28, 0) 75%
      );
      pointer-events: none;
      z-index: 1;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      width: min(720px, 44vw);
      margin-left: clamp(70px, 8vw, 150px);
      padding-top: clamp(70px, 9vh, 120px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* ===== LOGO ===== */
    .hero__logo {
      color: #ffffff;
      font-family: "Montserrat", sans-serif;
      font-size: clamp(32px, 3vw, 54px);
      line-height: .78;
      letter-spacing: -0.06em;
      margin-bottom: 42px;
      font-weight: 400;
    }

    .hero__logo span {
      display: block;
    }

    .hero__logo strong {
      font-weight: 800;
    }

    /* ===== TÍTULO ===== */
    .hero__title {
      font-family: "Anton", sans-serif;
      font-size: clamp(96px, 8.8vw, 170px);
      font-weight: 400;
      text-transform: uppercase;
      line-height: .86;
      letter-spacing: -0.02em;
      color: #f2eee8;
      margin: 0;
    }

    /* ===== SUBTÍTULO ===== */
    .hero__subtitle {
      font-family: "Anton", sans-serif;
      font-size: clamp(54px, 4.6vw, 88px);
      font-weight: 400;
      text-transform: uppercase;
      line-height: .86;
      letter-spacing: -0.02em;
      color: #f2eee8;
      margin: 8px 0 0 0;
    }

    /* ===== CLAIM / SECONDARY PHRASE ===== */
    .hero__claim {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .hero__claim .line {
      width: 60px;
      height: 2px;
      background: #d4af37;
      flex-shrink: 0;
    }

    .hero__claim p {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(16px, 1.25vw, 24px);
      font-weight: 600;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: .28em;
      line-height: 1.6;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hero__claim span {
      white-space: nowrap;
    }

    /* ===== CTA BUTTON ===== */
    .hero__cta {
      margin-top: 34px;
      width: clamp(430px, 34vw, 620px);
      height: clamp(64px, 5vw, 82px);
      border-radius: 999px;
      background: #071d3b;
      border: 2px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      color: #ffffff;
      font-family: "Montserrat", sans-serif;
      font-size: clamp(14px, 1.1vw, 18px);
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all .3s ease;
    }

    .hero__cta:hover {
      background: rgba(7, 29, 59, .8);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(212, 175, 55, .25);
    }

    .hero__cta-icon {
      font-size: 1.4em;
      flex-shrink: 0;
    }

    /* ===== WHATSAPP BUTTON (HIDDEN ON DESKTOP) ===== */
    .hero__whatsapp {
      display: none;
    }

    /* ===== MOBILE / TABLET ===== */
    @media (max-width: 768px) {
      .hero {
        min-height: 100svh;
        background-image: url('./hero-mobile-bg.png');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
      }

      .hero::before {
        background: linear-gradient(
          180deg,
          rgba(2, 12, 28, .12) 0%,
          rgba(2, 12, 28, 0) 45%,
          rgba(2, 12, 28, .08) 100%
        );
      }

      .hero__content {
        width: 100%;
        margin-left: 0;
        padding: 7vh 22px 0;
        align-items: center;
        text-align: center;
      }

      .hero__logo {
        margin-bottom: 5.4vh;
        transform: scale(.85);
        transform-origin: center top;
      }

      .hero__title {
        font-size: clamp(72px, 20vw, 112px);
        line-height: .86;
      }

      .hero__subtitle {
        font-size: clamp(39px, 11.5vw, 66px);
        line-height: .9;
        margin-top: 4px;
      }

      .hero__claim {
        margin-top: 4.8vh;
        width: 100%;
        justify-content: center;
        gap: 18px;
      }

      .hero__claim .line {
        width: 34px;
        height: 2px;
      }

      .hero__claim p {
        font-size: clamp(15px, 4vw, 22px);
        letter-spacing: .22em;
        line-height: 1.7;
      }

      .hero__cta {
        margin-top: 4.6vh;
        width: calc(100% - 44px);
        max-width: 520px;
        height: clamp(62px, 10vh, 78px);
        font-size: clamp(14px, 3.4vw, 20px);
      }

      .hero__whatsapp {
        display: flex;
        position: fixed;
        right: 22px;
        bottom: 22px;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: #25D366;
        color: white;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        border: 5px solid white;
        z-index: 10;
        text-decoration: none;
        cursor: pointer;
        transition: all .2s ease;
        box-shadow: 0 8px 24px rgba(37, 211, 102, .3);
      }

      .hero__whatsapp:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 32px rgba(37, 211, 102, .4);
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__content">
      <div class="hero__logo">
        <span>dinner</span>
        <span>in the <strong>sky</strong></span>
      </div>
      <h1 class="hero__title">ELEVARSE</h1>
      <h2 class="hero__subtitle">ES COSA DE LOCOS</h2>
      <div class="hero__claim">
        <span class="line"></span>
        <p>
          <span>EL MUNDO SE VE DIFERENTE</span>
          <span>DESDE AQUÍ ARRIBA.</span>
        </p>
        <span class="line"></span>
      </div>
      <a class="hero__cta" href="#experiencia">
        <span class="hero__cta-icon">💡</span>
        <span>CONOCE LA EXPERIENCIA</span>
      </a>
    </div>
    <a class="hero__whatsapp" href="https://api.whatsapp.com/send?phone=525545064656" aria-label="WhatsApp">
      ☎
    </a>
  </section>
</body>
</html>
